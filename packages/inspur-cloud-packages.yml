source: https://console1.cloud.inspur.com/document/oss/6-SDK-and-tool/SDK/1.sdk%E6%96%87%E6%A1%A3.html
note: 'Inspur Cloud publishes first-party SDKs only for its Object Storage Service (OSS) —
  C++, Java and Python — plus a C device SDK for the IoT platform. Nothing was found on npm,
  Maven Central, NuGet, RubyGems, Packagist, crates.io or pkg.go.dev for the compute,
  network, IAM or database APIs; those are documented as raw HTTP only. Only the Python SDK
  is distributed through a public package registry; the Java SDK is a direct JAR download
  from an OSS bucket and the C++ SDK is source-only. Registry checks run 2026-08-23 against
  registry.npmjs.org, pypi.org, search.maven.org, azuresearch-usnc.nuget.org and
  api.github.com.'
