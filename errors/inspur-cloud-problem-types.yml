object_storage_errors:
- code: AccessDenied
  title: 拒绝访问
  http_status: 403
  remediation: 原因及排除请参看权限问题及排查
- code: AllAccessDisabled
  title: 密钥失效
  http_status: 403
  remediation: 针对该资源，密钥已失效
- code: AccountProblem
  title: 账户存在问题
  http_status: 403
  remediation: '-'
- code: AuthorizationHeaderMalformed
  title: authorization无效
  http_status: 400
  remediation: 请求头中authorization header无效
- code: BadDigest
  title: 无效的摘要
  http_status: 400
  remediation: 指定的MD5校验值与文件不符，MD5的计算方法请参见PutObject
- code: BucketAlreadyExists
