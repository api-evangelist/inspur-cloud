note: 'Harvested verbatim from the 错误码 (error code) tables published in each product API reference appendix.
  Inspur Cloud does not use RFC 9457 problem+json. The platform APIs return a numeric dotted code in the
  response Code field, where the leading three digits identify the product (101 = ECS, 104 = CPS, 107
  = SLB, 003 = IAM) and the remainder identifies the resource group and condition. HTTP status is not
  mapped to these codes in the documentation, so a caller must read the body to distinguish a quota failure
  from a validation failure. Object Storage is the exception: it returns the S3-style XML Error envelope
  with a named Code and a real HTTP status. Messages are recorded in the original Simplified Chinese,
  which is the only language the provider publishes them in.'
format: proprietary-numeric-code
rfc9457: false
envelopes:
- family: platform
  services:
  - ECS
  - CPS
  - EBS
  - CBS
  - VPC
  - EIP
  - IPTS
  - SLB
  - IAM
  - RDS
  - TSDB
  content_type: application/json or application/xml (Format request parameter; xml is the documented default)
  fields:
  - name: RequestId
    description: Request tracking identifier
  - name: Code
    description: Dotted numeric error code
  - name: Message
    description: Human-readable message, Simplified Chinese
  - name: Data
    description: Result payload; absent or null on error
- family: object-storage
  services:
  - OSS
  content_type: application/xml
  fields:
  - name: Error
    description: Container for the error content
  - name: Code
    description: Named error code, e.g. AccessDenied, NoSuchBucket
  - name: Message
    description: Detailed message from OSS
  - name: RequestId
    description: Unique request identifier, for support escalation
  - name: Resource
    description: The bucket and object the error came from
  note: This is the Amazon S3 error envelope shape.
