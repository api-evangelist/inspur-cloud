aid: inspur-cloud
name: Inspur Cloud
description: 'Inspur Cloud (浪潮云) is the public-cloud arm of the Chinese IT conglomerate
  Inspur Group, operating from cloud.inspur.com across the cn-north-3 (华北三), cn-south-1
  (华南一) and cn-east-1 (华东一) regions. It publishes a broad IaaS/PaaS catalog — 94 products
  documented in its GitBook help centre — of which at least 16 ship a public HTTP API
  reference covering elastic compute (ECS), bare metal (CPS), block storage (EBS), backup
  (CBS), VPC networking, elastic IP, load balancing, IAM, RDS for MySQL, time-series
  database, container engine, blockchain and an S3-compatible object storage service
  (OSS). APIs are authenticated with an AK/SK request signature (x-secret-id / x-sign /
  x-time / x-random headers) or an IAM-issued bearer token. No OpenAPI, AsyncAPI or other
  machine-readable contract is published: the entire surface is hand-written HTML reference
  documentation in Simplified Chinese.'
