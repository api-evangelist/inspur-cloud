domain_standards:
- id: amazon-s3-api
  name: Amazon S3 REST API (object storage de-facto standard)
  conforms: true
  grade: strong
  evidence: 'Inspur Cloud Object Storage implements the S3 object-storage contract rather than
    a bespoke one, and says so in the contract itself. (1) The published signature algorithm
    is the Amazon S3 Signature Version 2 construction verbatim —
    Signature = base64(HMAC-SHA1(AccessKeySecret, VERB + "\n" + Content-MD5 + "\n" +
    Content-Type + "\n" + Date + "\n" + CanonicalizedOSSHeaders + CanonicalizedResource)) —
    with the vendor header prefix x-oss- in place of x-amz-, documented at
    /document/oss/5-API/5.3-access-control/01-user-signature.html. (2) The operation set is
    the S3 operation set by name: ListBuckets, PutBucket, HeadBucket, DeleteBucket,
    GetBucketLocation, PutBucketACL, GetBucketACL, PutBucketLifecycle, GetBucketLifecycle,
    DeleteBucketLifecycle, ListMultipartUploads, PutBucketCors, PutBucketVersioning,
    PutBucketEncryption, PutObject, AppendObject, GetObject, HeadObject, DeleteObject,
    DeleteMulitipleObject, PutObjectACL, CopyObject, InitiateMultipartUpload, MultipartUpload,
    CompleteMultipartUpload, AbortMultipartUpload. (3) The error envelope is the S3 XML Error
    container with Code / Message / RequestId / Resource. (4) Inspur Cloud publishes operating
    documentation for three third-party S3 clients — S3cmd, S3Browser and Rclone — as the
    supported way to use the service, which is only possible if the wire contract is
    S3-compatible. (5) A live unauthenticated HEAD against
    inspur-cloud-sdk.oss.cn-north-3.inspurcloudoss.com on 2026-08-23 returned HTTP 200 with
    x-amz-request-id and x-amz-object-type response headers, confirming the S3 contract at
    runtime and not only on the documentation page.'
  urls:
  - https://console1.cloud.inspur.com/document/oss/5-API/5.3-access-control/01-user-signature.html
  - https://console1.cloud.inspur.com/document/oss/6-SDK-and-tool/tool/S3cmd/S3cmd%E6%A6%82%E8%A7%88.html
  buyer_impact: 'A team already speaking S3 can point an existing client, backup tool or data
    pipeline at Inspur Cloud OSS with an endpoint and credential change. Every other Inspur
    Cloud API requires a bespoke connector built from Chinese-language HTML documentation.'
- id: opentsdb
  name: OpenTSDB HTTP API
  conforms: true
  grade: partial
  evidence: 'The Time Series Database API reference publishes a dedicated "opentsdb接口"
    (OpenTSDB interface) group alongside its native /tsdb/v1 operations, so metric write and
    query traffic can use the OpenTSDB wire protocol rather than an Inspur-specific one.'
  urls:
