- id: kubernetes
  name: Kubernetes API / CNCF cloud-provider interface
  conforms: true
  grade: partial
  evidence: 'The container engine (ICE/CKS) exposes cluster, node, namespace and Istio
    VirtualService concepts directly, and Inspur publishes an out-of-tree
    cloud-controller-manager (github.com/OpenInspur/cloud-provider-inspur) and CSI-shaped
    storage drivers (github.com/OpenInspur/instorage-k8s), which is the standard integration
    contract rather than a proprietary one.'
  urls:
  - https://github.com/OpenInspur/cloud-provider-inspur
  - https://console1.cloud.inspur.com/document/cks/9-opencontainer-api/9.1-1-container-menu.html
- id: mqtt
  name: MQTT
  conforms: true
  grade: partial
  evidence: 'The IoT platform device SDK is an MQTT client built on mbedTLS with a device
    shadow, and the documentation publishes a device protocol support page. Topic namespace
    and payload schemas are not published, so this is protocol conformance without a
    documented message contract (it is not, for example, Sparkplug B).'
  urls:
