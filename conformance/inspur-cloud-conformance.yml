note: 'Assessed against the published documentation only. Inspur Cloud publishes no OpenAPI,
  AsyncAPI, JSON Schema or other machine-readable contract anywhere on its surface, so every
  contract-shaped assertion below is read from prose reference pages and from live response
  headers observed on the public OSS endpoint.'
standards:
- id: openapi
  conforms: false
  evidence: 'No OpenAPI or Swagger document is served on cloud.inspur.com, console1.cloud.inspur.com,
    en.inspur.com or any documented API host. /openapi.json, /swagger.json, /v2/api-docs and
    /api-docs all return 404 or 403 (probed 2026-08-23). The API references are hand-written
    GitBook HTML. The API Gateway PRODUCT supports Swagger import/export for customers
    publishing their own APIs (APIG v1.5.0, 2020-04-24), but Inspur Cloud does not use it to
    describe its own platform APIs.'
- id: asyncapi
  conforms: false
  evidence: 'No AsyncAPI document and no event/webhook catalog. The only asynchronous surface
    documented is MQTT for IoT devices, described in prose and in a C device SDK, with no
    channel or message schema published.'
- id: oauth2
  conforms: false
  evidence: 'No OAuth 2.0 authorization-server metadata, no authorization or token endpoint in
    any public reference. Authentication is an AK/SK request signature or an IAM-issued
    bearer token. /.well-known/oauth-authorization-server returns 404 on every host.'
- id: oidc
  conforms: false
  evidence: /.well-known/openid-configuration returns 404 on every probed host.
- id: rfc9457
  conforms: false
  evidence: 'Errors are a proprietary dotted numeric code in a JSON or XML body (Code /
    Message / RequestId / Data). No application/problem+json. See
    errors/inspur-cloud-problem-types.yml.'
- id: rfc9116-security-txt
  conforms: false
  evidence: /.well-known/security.txt returns 404 on every probed host.
- id: rfc8594-sunset
  conforms: false
  evidence: No Sunset or Deprecation header, and no deprecation policy, is documented.
- id: idempotency
  conforms: false
  evidence: 'No idempotency key or client token is documented on any write operation. The
    Nonce and x-random values are replay PREVENTION, which is the opposite property. See
    conventions/inspur-cloud-conventions.yml.'
- id: pagination
  conforms: partial
  evidence: 'Page-based pagination is consistently offered in the REST-shaped APIs as a
    separate "Page" operation with pageIndex/pageSize (IAM) or pageNo/pageSize (TSDB) path
    segments, but no envelope, total count field, or cursor is documented, and the
    compute/network APIs do not document pagination at all.'
- id: rfc7807
  conforms: false
