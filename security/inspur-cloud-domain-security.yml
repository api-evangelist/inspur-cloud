findings:
- id: expired-api-host-certificates
  severity: high
  detail: The public API endpoint hosts serve TLS certificates that expired years ago. ecs.cn-north-3.inspurcloudapi.com
    presents CN=*.cn-north-3.inspurcloudapi.com issued by TrustAsia TLS RSA CA, valid 2019-12-10 to 2020-12-09.
    ecs.cn-east-1.inspurcloudapi.com presents CN=*.cn-east-1.inspurcloudapi.com, valid 2021-07-09 to 2022-07-08.
    Any client performing standard certificate validation cannot complete a TLS handshake with these hosts.
  observed: '2026-08-23'
  hosts:
  - ecs.cn-north-3.inspurcloudapi.com
  - ecs.cn-east-1.inspurcloudapi.com
- id: api-host-certificate-name-mismatch
  severity: medium
  detail: iam.inspurcloudapi.com resolves via iam.cn-north-3.inspurcloudapi.com to a host presenting CN=*.cloud.inspur.com
    (sslTrus DV CA, valid 2026-02-06 to 2027-02-06) — a currently-valid certificate for a different name
    than the API host.
  observed: '2026-08-23'
- id: www-inspurcloudapi-is-not-the-provider
  severity: info
  detail: www.inspurcloudapi.com resolves to a ChinaNetCenter/Wangsu CDN edge presenting CN=default.chinanetcenter.com
