note: 'Inspur Cloud publishes no API rate limits. Across all 16 documented API references
  there is no requests-per-second figure, no burst allowance, no 429 semantics, and no
  rate-limit response header of any kind — not X-RateLimit-*, not RateLimit-*, not
  Retry-After. An agent calling these APIs has no runtime signal telling it how close it is
  to being throttled, and no documented status code to recognise when it has been. What the
  provider does publish is RESOURCE QUOTAS — caps on how many objects of a type an account
  may hold — plus a traffic-control feature in the API Gateway PRODUCT that customers apply
  to their own published APIs, not to Inspur Cloud''s platform APIs. Both are recorded below
  and neither is a rate limit.'
